apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: myapp
  name: myapp
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  strategy: {}
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - image: easzlab.io.local:5000/myapp:v1
        name: myapp
        env:
        - name: HAS_BUG
          value: "false"
        ports:
        - containerPort: 8000
        resources: {}
status: {}
