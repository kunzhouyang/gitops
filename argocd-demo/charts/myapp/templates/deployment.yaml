apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
  name: {{ include "myapp.fullname" . }}
  namespace: {{ include "myapp.namespace" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" . | nindent 6 }}
  strategy: {}
  template:
    metadata:
      labels:
        {{- include "myapp.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
      - image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        name: {{ .Chart.Name }}
        {{- with .Values.envs }}
        env:
        {{- range . }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: 8000
        {{- with .Values.livenessProbe }}
        livenessProbe:
          httpGet:
            path: {{ .httpGet.path }}
            port: {{ .httpGet.port }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          httpGet:
            path: {{ .httpGet.path }}
            port: {{ .httpGet.port }}
        {{- end }}
        resources: {}
status: {}
