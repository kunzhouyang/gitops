apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
  name: {{ include "myapp.fullname" . }}
  namespace: {{ include "myapp.namespace" . }}
spec:
  ports:
  - port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: 8000
  selector:
    {{- include "myapp.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}
status:
  loadBalancer: {}
